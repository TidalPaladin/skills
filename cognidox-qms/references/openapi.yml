                $ref: '#/components/examples/document-draft-with-version'
              issue:
                $ref: '#/components/examples/document-issue'
            schema:
              properties:
                count:
                  description: The total number of slices in the document.
                  type: integer
                issueComment:
                  description: An optional description about the issue being created.
                  type: string
                issueLicenseeComment:
                  description: An optional description for the licensee audience.
                  type: string
                issueType:
                  description: The kind of the issue.
                  enum:
                  - issue
                  - draft
                  type: string
                length:
                  description: The size of the document in bytes. i.e. the sum of
