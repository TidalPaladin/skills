                  - mm
                  - numbers
                  - wma
                  - vssx
                  - dfx
                  - key
                  - vsdm
                  - tbz
                  - rpm
                  - csv
                  - dotx
                properties:
                  documentType:
                    type: string
                  extensions:
                    items:
                      type: string
                    type: array
                title: DocumentTypesResponse
                type: object
          description: OK.
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
