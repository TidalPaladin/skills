                  nullable: false
                  type: integer
                title:
                  description: Optionally locate documents using part of their title.
                  maxLength: 255
                  minLength: 1
                  nullable: false
                  type: string
                versionInformation:
                  description: Optionally locate documents by version information.
                  minLength: 1
                  nullable: false
                  type: string
              title: SearchRequest
              type: object
        description: The search criteria to use.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/searchResult'
          description: OK
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
      security:
      - bearerAuth:
        - read:documents
      - oauth2:
        - oauth2
      summary: Locate documents by their attributes.
      tags:
      - Repository
      x-cognidox-ms-office-add-in: true
  /repository/extensions/{documentType}:
    get:
      description: Retrieve the filename extensions for the specified document type.
