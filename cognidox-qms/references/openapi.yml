                  type: string
                secondaryFilename:
                  description: The optional value of the second filename assigned.
                  type: string
                skipPrefilter:
                  description: An optional value for whether pre-filtering should
                    be applied or not.
                  type: boolean
                version:
                  description: The optional new draft/issue version of the document.
                  type: string
                versionInformation:
                  description: An optional string relating to the version
                  type: string
              required:
