          type: string
      title: NewDocumentInformationResult
      type: object
    newDocumentResult:
      example:
        partNumber: VI-403808-CS
      properties:
        partNumber:
          type: string
      required:
      - partNumber
      title: NewDocumentResult
      type: object
    optionsResult:
      example:
        commentOnDraft: true
        commentOnIssue: true
        requireCheckout: false
        versionInfoOnDraft: false
        versionInfoOnIssue: false
      properties:
        commentOnDraft:
          description: Indicates whether all draft documents require comments on submission.
          type: boolean
        commentOnIssue:
          description: Indicates whether all issue documents require comments on submission.
          type: boolean
        requireCheckout:
          description: Indicates whether a document must be checked out in order to
            change it.
          type: boolean
        versionInfoOnDraft:
          description: Indicates whether version info is required or no not when creating
            drafts.
          type: boolean
        versionInfoOnIssue:
          description: Indicates whether version info is required or no not when creating
            issues.
          type: boolean
      title: OptionsResult
      type: object
    searchResult:
      example:
        limit: 2147483647
        matches:
        - filename: DM-000401-AN-B.docx
          metadata:
          - name: GDPR Classifications
            value: None
          partNumber: DM-000401-AN
          published: false
          title: Add-in testing
          url: https://cognidox.example.net/DM-000401-AN
        - filename: DM-001401-RC-A.msg
          metadata: []
          partNumber: DM-001401-RC
          published: false
          title: 200305 UI Feedback from Adrian Green (PPC)
          url: https://cognidox.example.net/DM-001401-RC
        - filename: KI-000311-CS-1.docx
          metadata: []
          partNumber: KI-000311-CS
          published: false
          title: 200401 Fabless Semi - Leeds Ltd. - NDA
          url: https://cognidox.example.net/KI-000311-CS
        - filename: KI-000310-CS-1.docx
          metadata: []
          partNumber: KI-000310-CS
          published: false
          title: 200401 Fabless Semi - London Ltd. - NDA
          url: https://cognidox.example.net/KI-000310-CS
        - filename: VI-401112-TC-17.pdf
          metadata: []
          partNumber: VI-401112-TC
          published: false
          title: Cognidox Admin Guide
          url: https://cognidox.example.net/VI-401112-TC
        offset: 0
        total: 5
      properties:
        limit:
          description: The number of items returned.
          type: integer
        matches:
          description: The set of matched items.
          items:
            properties:
              filename:
                description: The optional name of the file associated with the document.
                nullable: true
                type: string
              metadata:
                $ref: '#/components/schemas/metadata'
                description: A set of key/value pairs associated with the document.
              partNumber:
                description: The identity of the matched document.
                type: string
              published:
                description: Whether the document has been published or not.
                type: boolean
              title:
                description: The moniker assigned to the document.
                type: string
              url:
                description: The location of the document in the repository.
                type: string
            title: Match
            type: object
          type: array
        offset:
          description: The index of the first item returned.
          minimum: 0
          type: integer
        total:
          description: The total number of documents that match the search criteria.
          type: integer
      title: SearchResult
      type: object
    systemInformationResult:
      example:
        addInBlocked: false
        latestAPIVersion: 1.2
        productName: Cognidox
        productVersion: 10.2.0 (development)
        serverUTCTime: 1642530807
      properties:
        addInBlocked:
          description: Whether users can use the Add-in or not for accessing the document
            repository.
          type: boolean
        latestAPIVersion:
          description: The version number of the application interface.
          format: float
          type: number
        productName:
          description: The moniker that is assigned by Cognidox to the software.
          type: string
        productVersion:
          description: The version number, in standard major, minor and patch format.
          type: string
        serverUTCTime:
          description: The number of seconds since 1970.
          format: int64
          type: integer
      title: SystemInformationResult
      type: object
    versionFileInformation:
      properties:
        PDF:
          description: The optional filename and extension of the PDF version.
          nullable: true
          type: string
        PDFAccess:
          description: Whether the content of the 'PDF' is available to the user
          nullable: true
          type: boolean
        PDFAlt:
          description: The optional filename, which includes the version, the document's
            title and the extension of the PDF format version.
          nullable: true
          type: string
        PDFUrl:
          description: The location to access the 'PDF' format of the content.
          nullable: true
          type: string
        master:
          description: The filename and extension.
          type: string
        masterAccess:
          description: Whether the 'native' content is available to the user.
          type: boolean
        masterAlt:
          description: The filename, which includes the version, the document's title
            and the extension.
          type: string
        masterURL:
          description: The location to access the 'native' format of the content.
          type: string
        version:
          description: The version identifier.
          type: string
      title: VersionFileInformation
      type: object
    versionResult:
      example:
        length: 13400
        links:
        - href: https://cognidox.example.net/api/v1.0/documents/versions/VI-410057-TC/1A/0/2000?sliceSize=4500&format=native
          rel: urn:VI-410057-TC-1A:0
        - href: https://cognidox.example.net/api/v1.0/documents/versions/VI-410057-TC/1A/1/2000?sliceSize=4500&format=native
          rel: urn:VI-410057-TC-1A:1
        - href: https://cognidox.example.net/api/v1.0/documents/versions/VI-410057-TC/1A/2/2000?sliceSize=4500&format=native
          rel: urn:VI-410057-TC-1A:2
        partNumber: VI-410057-TC
        version: 1A
      properties:
        length:
          description: The size of the document in bytes.
          type: integer
        links:
          description: A set of information for each of the individual parts of the
            version.
          items:
            properties:
              href:
                description: The URL to retrieve the part of the version.
                type: string
              rel:
                description: A unique reference name that identifies the part.
                type: string
            title: Link
            type: object
          type: array
        partNumber:
          description: The identity of the document.
          type: string
        version:
          description: The version identifier.
          type: string
      title: VersionResult
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: |
        API access using Personal Access Tokens generated via the Cognidox web
        user interface. Tokens using this security scheme must have scopes
        attached to them. The 'oauth2' scope is not available to Personal
        Access Tokens.
      scheme: bearer
      type: http
    oauth2:
      description: |
        This API uses OAuth2. In order to use the authorizationCode a client_id
        and client_secret are required. The redirect URI is always
        https://api.cognidox.com/oauth2/dialog, with domain name
        adjusted for the local Cognidox server.
      flows:
        authorizationCode:
          authorizationUrl: https://cognidox.example.net/oauth2/dialog
          scopes:
            oauth2: |
              Access to all endpoints, with authorization controlled by
              standard Cognidox mechanisms.
          tokenUrl: https://cognidox.example.net/oauth2/token
      type: oauth2
info:
  contact:
    email: support@cognidox.com
    name: Cognidox Support
    url: https://support.cognidox.com/
  description: |
    This is the RESTful API to the Cognidox server.<br><br>
    This version of the API replicates key SOAP operations that are primarily required by the Microsoft
    Office Add-in:
    * CogniDoxCategoryCreate
    * CogniDoxCategoryDelete
    * CogniDoxCategoryInfo
    * CogniDoxCategoryList
    * CogniDoxCategoryNewDocumentInfo
    * CogniDoxCategoryRename
    * CogniDoxCheckin
    * CogniDoxCheckout
    * CogniDoxCreateDoc
    * CogniDoxCreateVersionMTOM
    * CogniDoxDeleteDoc
    * CogniDoxDocActions
    * CogniDoxDocFileInfo
    * CogniDoxDocInfo
    * CogniDoxDocLockInfo
    * CogniDoxDocSearch
    * CogniDoxDocSecurity
    * CogniDoxDocTemplates
    * CogniDoxListDocumentTypes
    * CogniDoxListFilenameExtensions
    * CogniDoxRenameDoc
    * CogniDoxSystemInfo
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.cognidox.com/terms-of-service
  title: Cognidox
  version: '1.0'
openapi: 3.0.2
paths:
  /categories:
    get:
      description: Retrieve information about the root category, its documents and
        sub categories.
      operationId: getRootCategoryInformation
      parameters:
      - description: What to retrieve. If not present, then just 'details' are returned.
        in: query
        name: filter
        required: false
        schema:
          items:
            enum:
            - details
            - children
            - documents
            - categories
            type: string
          type: array
      - description: Offset into the set of documents or categories.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Maximum number of items in the set of documents or categories.
        in: query
        name: limit
        required: false
        schema:
          default: 2147483647
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/categoryResult'
          description: OK
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
      security:
      - bearerAuth:
        - read:categories
      - oauth2:
        - oauth2
      summary: Get root category details.
      tags:
      - Categories
      x-cognidox-ms-office-add-in: true
    post:
      operationId: newCategory
      requestBody:
        content:
          application/json:
            schema:
              example:
                name: Marketing
                parentId: 50
              properties:
                name:
                  description: The new category's moniker.
                  type: string
                parentId:
                  description: The identity of the parent category.
                  type: integer
                sortOrderName:
                  description: An optional moniker that can be used to change where
                    the category appears in a list, overriding its normal alphabetical
                    position.
                  nullable: true
                  type: string
                subtitle:
                  description: An optional value used to identify the new category.
                  nullable: true
                  type: string
              title: NewCategoryRequest
              type: object
        description: Where to create the new category and its moniker.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/categoryCreateResult'
          description: Category created
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
      security:
      - bearerAuth:
        - write:categories
      - oauth2:
        - oauth2
      summary: Create a new sub category.
      tags:
      - Categories
      x-cognidox-ms-office-add-in: true
  /categories/recommendations/{categoryId}:
    post:
      description: Retrieve a set of suggestions to use when creating a new document
        in the specified category.
      operationId: newDocumentRecommendations
      parameters:
      - description: The identity of the parent category.
        example: 23
        in: path
        name: categoryId
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              example:
                emailAddress: author@example.com
                filenameExtension: docx
                ignoreReplacements: false
              properties:
                emailAddress:
                  description: An optional email address of the person creating the
                    document.
                  format: email
                  nullable: true
                  type: string
                filenameExtension:
                  description: An optional value for document file extension.
                  nullable: true
                  type: string
                ignoreReplacements:
                  description: An optional boolean to set whether variable expansion
                    of titles should be ignored. If unset or false, titles will be
                    returned after variable expansion.
                  type: boolean
              title: NewDocumentRecommendationsRequest
              type: object
        description: Additional information for the recommendations.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/newDocumentInformationResult'
          description: Details of the recommendations for a new document.
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
        '404':
          description: Not found
      security:
      - bearerAuth:
        - read:categories
      - oauth2:
        - oauth2
      summary: Retrieve suggestions for a new document.
      tags:
      - Categories
      x-cognidox-ms-office-add-in: true
  /categories/{categoryId}:
    delete:
      operationId: deleteCategory
      parameters:
      - description: The identity of the category to remove.
        example: 201
        in: path
        name: categoryId
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Delete successful
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
        '404':
          description: Not found
      security:
      - bearerAuth:
        - write:categories
      - oauth2:
        - oauth2
      summary: Remove the specified category.
      tags:
      - Categories
      x-cognidox-ms-office-add-in: true
    get:
      description: Retrieve information about a category, its documents and sub categories.
      operationId: getCategoryInformation
      parameters:
      - description: The identity of the category.
        example: 123
        in: path
        name: categoryId
        required: true
        schema:
          minimum: 0
          type: integer
      - description: What to retrieve. If not present, then just 'details' are returned.
        in: query
        name: filter
        required: false
        schema:
          items:
            enum:
            - details
            - children
            - documents
            - categories
            type: string
          type: array
      - description: Offset into the set of documents or categories.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Maximum number of items in the set of documents or categories.
        in: query
        name: limit
        required: false
        schema:
          default: 2147483647
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/categoryResult'
          description: OK
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
        '404':
          description: Not found
      security:
      - bearerAuth:
        - read:categories
      - oauth2:
        - oauth2
      summary: Get category details.
      tags:
      - Categories
      x-cognidox-ms-office-add-in: true
    patch:
      description: Alter one or more attributes of a specific category.
      operationId: updateCategory
      parameters:
      - description: The identity of the category to update.
        example: 73
        in: path
        name: categoryId
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            examples:
              rename:
                $ref: '#/components/examples/category-rename'
              sorting:
                $ref: '#/components/examples/category-reorder'
            schema:
              properties:
                name:
                  description: The new moniker.
                  type: string
                sortOrderName:
                  description: An optional new moniker to use to change where the
                    category appears in a list.
                  nullable: true
                  type: string
                subtitle:
                  description: An optional new value used to identify the category.
                  nullable: true
                  type: string
              title: UpdateCategoryRequest
              type: object
        description: Details of the new values for the category.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/categoryUpdateResult'
          description: Current category details.
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
        '404':
          description: Not found
      security:
      - bearerAuth:
        - write:categories
      - oauth2:
        - oauth2
      summary: Update the category.
      tags:
      - Categories
      x-cognidox-ms-office-add-in: true
  /documents:
    post:
      description: Creates a new document and assigns it a part number in the specified
        category.
      operationId: newDocument
      requestBody:
        content:
          application/json:
            schema:
              example:
                author: Mr Cognidox
                categoryId: 50
                documentType: CS
                title: New document
              properties:
                author:
                  description: The optional name of the person who created the document.
                  type: string
                categoryId:
                  description: The identity of the parent category.
                  type: integer
                documentType:
                  description: The document type. One, or both, of this and manualPartNumber
                    must be supplied.
                  pattern: ^[A-Z]{2}$
                  type: string
                manualPartNumber:
                  description: The optional value of the part number to assign. One,
                    or both, of this and documentType must be supplied.
                  pattern: ^[A-Z]{2}-\d{6}-[A-Z]{2}$
                  type: string
                title:
                  description: The title of the new document.
                  maxLength: 255
                  pattern: ^(?!\s*$)
                  type: string
              required:
              - categoryId
              - title
              title: NewDocumentRequest
              type: object
        description: The details of the new document.
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/newDocumentResult'
          description: New document created.
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
      security:
      - bearerAuth:
        - write:documents
      - oauth2:
        - oauth2
      summary: Create a new document.
      tags:
      - Documents
      x-cognidox-ms-office-add-in: true
  /documents/constraints/{partNumber}:
    get:
      description: Retrieve the set of operations that can be carried out by the user
        on the specified document.
      operationId: getDocumentConstraints
      parameters:
      - description: The identity of the document.
        example: DM-000401-AN
        in: path
        name: partNumber
        required: true
        schema:
          type: string
      - description: The document version, issue or drafts.
        example: 1B
        in: query
        name: issueNumber
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/documentActionResult'
          description: OK
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
        '404':
          description: Not found
      security:
      - bearerAuth:
        - read:documents
      - oauth2:
        - oauth2
      summary: Retrieve what can be done by the user.
      tags:
      - Documents
      x-cognidox-ms-office-add-in: true
  /documents/forms/{categoryFormId}:
    post:
      description: Creates a document from a form associated with category
      operationId: newFormDocument
      parameters:
      - description: The the identity of the category form
        example: 16306b8a-f984-11ee-bbba-d9269ad84872
        in: path
        name: categoryFormId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              minProperties: 1
              properties:
                title:
                  description: The title to give the newly created form document
                  nullable: false
                  type: string
              required:
              - title
              title: NewPartNumberFromCategoryFormRequest
              type: object
        description: The details of the new empty document to create.
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/documentCreateFormResult'
          description: New document created for the appropriate form.
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
        '404':
          description: Not found
      security:
      - bearerAuth:
        - write:documents
      - oauth2:
        - oauth2
      summary: Create a form document part number using a category form. This will
        create a part number of the appropriate document type in the category specified
        by the category template ID linked to the appropriate form.
      tags:
      - Documents
  /documents/locks/{partNumber}:
    get:
      description: Retrieve the details of any locks that have been placed on the
        document.
      operationId: getDocumentLock
      parameters:
      - description: The identity of the document.
        example: DM-000401-AN
        in: path
        name: partNumber
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/documentLockResult'
          description: OK
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
        '404':
          description: Not found
      security:
      - bearerAuth:
        - read:documents
      - oauth2:
        - oauth2
      summary: Get document lock details.
      tags:
      - Documents
      x-cognidox-ms-office-add-in: true
  /documents/permissions/{partNumber}:
    get:
      description: Retrieve the details of the security that has been applied to the
        specified document.
      operationId: getDocumentPermissions
      parameters:
      - description: The identity of the document.
        example: DM-000401-AN
        in: path
        name: partNumber
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/documentPermissionsResult'
          description: OK
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
        '404':
          description: Not found
      security:
      - bearerAuth:
        - read:documents
      - oauth2:
        - oauth2
      summary: Get document permissions.
      tags:
      - Documents
      x-cognidox-ms-office-add-in: true
  /documents/templates/{documentId}/{index}:
    get:
      description: Download the document content, or a slice of the document content,
        that was previously created using createFromTemplate. The document can be
        downloaded in individual slices, by providing query parameter 'sliceSize'.
        If 'index' is zero, and 'sliceSize' is not supplied, then the entire content
        of the document will be returned.
      operationId: getTemplateSlice
      parameters:
      - description: The identity of the created document.
        example: 6d55b44a-7e43-11ee-a2d4-2792ef06602b
        in: path
        name: documentId
        required: true
        schema:
          format: uuid
          type: string
      - description: The zero-based index of the document slice that be will returned.
        example: 2
        in: path
        name: index
        required: true
        schema:
          minimum: 0
          type: integer
      - description: The size in bytes of the document slice to return. If this is
          the final slice of the document, then fewer bytes might be returned.
        example: 64000
        in: query
        name: sliceSize
        required: false
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: The bytes of the slice.
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
        '404':
          description: Not found
      security:
      - bearerAuth:
        - write:documents
      - oauth2:
        - oauth2
      summary: Download document content that was created using createFromTemplate.
      tags:
      - Documents
  /documents/templates/{partNumber}:
    get:
      description: Retrieve the list of templates associated with the specified document.
      operationId: getDocumentTemplates
      parameters:
      - description: The identity of the document.
        example: DM-000401-AN
        in: path
        name: partNumber
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/documentTemplatesResult'
          description: OK
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
        '404':
          description: Not found
      security:
      - bearerAuth:
        - read:documents
      - oauth2:
        - oauth2
      summary: Get Document Templates.
      tags:
      - Documents
      x-cognidox-ms-office-add-in: true
    post:
      description: Creates the document content for the specified part number, with
        the part number and next draft version added to the document as custom properties.
        The content can be created either from an existing template, or from a blank
        document supplied by a plugin. If creating the document content from a plugin,
        then the plugin name must be supplied as a body parameter. If successful,
        details of where to download the document from are returned in the response.
      operationId: createFromTemplate
      parameters:
      - description: The identity of the created document.
        example: DM-000401-AN
        in: path
        name: partNumber
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              empty:
                $ref: '#/components/examples/document-empty'
              template:
                $ref: '#/components/examples/document-template'
            schema:
              additionalProperties: false
              minProperties: 3
              properties:
                application:
                  description: Which office application we should create the document
                    for.
                  enum:
                  - excel
                  - powerpoint
                  - word
                  example: word
                  type: string
                issueType:
                  description: Is document a draft or an issue?
                  enum:
                  - draft
                  - issue
                  example: draft
                  type: string
                plugin:
                  description: The plugin that provides a blank template. This is
                    required in the case where a template part number is not provided.
                  example: CogniDoxMSOfficePlugin
                  pattern: ^CogniDox[A-Za-z]+Plugin$
                  type: string
                sliceSize:
                  description: The size in bytes of the document slices to download.
                  example: 64000
                  minimum: 1
                  type: integer
                template:
                  description: The optional part number of the template to use. Either
                    this or 'plugin' is required.
                  example: KI-000310-CS
                  pattern: ^[A-Z]{2}-\d{6}-[A-Z]{2}$
                  type: string
                version:
                  description: Optional version number for new document.
                  example: 42A
                  pattern: ^[A-Z0-9]{1,4}$
                  type: string
                versionInfo:
                  description: An optional string relating to the version.
                  example: 47.58-34A (beta)
                  type: string
              required:
              - application
              - issueType
              title: NewDocumentFromTemplateRequest
              type: object
        description: The details of the new empty document or document from template
          to create.
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: false
                example:
                  expires: 2022-11-20T16:55:28Z
                  length: 45876
                  links:
                  - href: https://example.com/api/v1.0/documents/templates/dcfbde84-7e32-11ee-9a55-b723900a52ec/0?sliceSize=64000
                    rel: urn:VI-410057-TC:0
                  - href: https://example.com/api/v1.0/documents/templates/dcfbde84-7e32-11ee-9a55-b723900a52ec/1?sliceSize=64000
                    rel: urn:VI-410057-TC:1
                  partNumber: VI-410057-TC
                  version: A
                properties:
                  documentId:
                    description: The unique ID of the temporary document.
                    format: uuid
                    type: string
                  expires:
                    description: Expiry date and time of the temporary document, after
                      which it will no longer be available for download.
                    format: date-time
                    type: string
                  length:
                    description: The document size in bytes.
                    type: integer
                  links:
                    description: A set of information for each of the individual parts
                      of the document.
                    items:
                      properties:
                        href:
                          description: The URL to retrieve the part of the document.
                          type: string
                        rel:
                          description: A unique reference name that identifies the
                            part.
                          type: string
                      title: Link
                      type: object
                    type: array
                  partNumber:
                    description: The part number of the document.
                    type: string
                  template:
                    description: The part number of the template (if applicable).
                    type: string
                  version:
                    description: The version identifier.
                    type: string
                required:
                - documentId
                - expires
                - length
                - links
                - partNumber
                - version
                title: CreateFromTemplateResponse
                type: object
          description: Create document from empty or template download details.
        '400':
          $ref: '#/components/responses/errorBadRequest'
        '401':
          $ref: '#/components/responses/errorUnauthorized'
        '403':
          $ref: '#/components/responses/errorForbidden'
      security:
      - bearerAuth:
        - write:documents
      - oauth2:
        - oauth2
      summary: Create a temporary document from a template
      tags:
      - Documents
