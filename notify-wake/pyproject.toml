[project]
name = "notify-wake-runtime"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "websockets==16.1.1",
]

[dependency-groups]
dev = [
  "basedpyright==1.39.9",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
]

[tool.uv]
package = false

[tool.basedpyright]
include = [
  "runtime",
  "scripts",
  "tests",
]
extraPaths = [
  "runtime",
]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"

[tool.coverage.run]
branch = true
source = [
  "notify_wake",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = [
  "tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "B",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "ISC",
  "RUF",
  "SIM",
  "UP",
]
